<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมทุบตัวตุ่นสุดมันส์ (Whac-A-Mole)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #f1c40f;
        }

        .status {
            font-size: 20px;
            margin-bottom: 20px;
        }

        /* โซนเกมที่ใช้เมาส์ค้อน */
        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            /* ซ่อนเมาส์ปกติเพื่อใช้ค้อน */
            cursor: none; 
        }

        .hole {
            background-color: #7f8c8d;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: none;
            position: relative;
            overflow: hidden;
            border: 4px solid #16a085;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
        }

        .mole {
            position: absolute;
            bottom: -100%;
            transition: bottom 0.2s ease;
            user-select: none;
        }

        .mole.up {
            bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2ecc71;
        }

        /* เมาส์ค้อน 🔨 */
        .custom-hammer {
            position: fixed;
            width: 60px;
            height: 60px;
            font-size: 45px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-15px, -35px) rotate(0deg);
            transition: transform 0.04s;
            display: none; /* แสดงเฉพาะตอนเข้าโซนเกม */
        }

        /* เวลาทุบให้ค้อนเอียงลง */
        .custom-hammer.smash {
            transform: translate(-15px, -35px) rotate(-45deg) scale(0.9);
        }
    </style>
</head>
<body>

    <h1>🔨 เกมทุบตัวตุ่น (Whac-A-Mole)</h1>
    
    <div class="status">
        คะแนน: <span id="score">0</span> | 
        เวลา: <span id="timeLeft">30</span> วินาที | 
        คะแนนสูงสุด: <span id="highScore">0</span>
    </div>

    <!-- โซนกระดานเกม -->
    <div class="game-container" id="gameZone">
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
    </div>

    <button id="startBtn" onclick="startGame()">เริ่มเกม</button>

    <!-- ตัวค้อนจำลอง -->
    <div class="custom-hammer" id="hammer">🔨</div>

    <script>
        // ระบบจำลองเสียงเอฟเฟกต์สด (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                // เสียงทุบตุ่นดัง "ตึ๊ก!"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'miss') {
                // เสียงทุบพลาดหลุมดัง "วืด"
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            }
        }

        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreDisplay = document.getElementById('score');
        const timeLeftDisplay = document.getElementById('timeLeft');
        const highScoreDisplay = document.getElementById('highScore');
        const gameZone = document.getElementById('gameZone');
        const hammer = document.getElementById('hammer');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let lastHole;
        let countdownTimer;
        let moleTimer;
        let highScore = localStorage.getItem('mole_highScore') || 0;

        highScoreDisplay.textContent = highScore;

        // ระบบควบคุมค้อนตามเมาส์
        gameZone.addEventListener('mouseenter', () => hammer.style.display = 'block');
        gameZone.addEventListener('mouseleave', () => hammer.style.display = 'none');
        gameZone.addEventListener('mousemove', (e) => {
            hammer.style.left = e.clientX + 'px';
            hammer.style.top = e.clientY + 'px';
        });

        // สับค้อนลงตอนคลิก
        gameZone.addEventListener('mousedown', (e) => {
            initAudio(); // เปิดระบบเสียง
            hammer.classList.add('smash');
            setTimeout(() => hammer.classList.remove('smash'), 50);
            
            // ถ้าคลิกโดนหลุมเปล่าๆ ให้ส่งเสียงพลาด
            if (isPlaying && !e.target.classList.contains('mole')) {
                playSound('miss');
            }
        });

        function randomTime(min, max) {
            return Math.floor(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function showMole() {
            if (!isPlaying) return;
            // ตัวตุ่นโผล่ความเร็วปกติเหมือนของเดิม (600 - 1200 มิลลิวินาที)
            const time = randomTime(600, 1200); 
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.add('up');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up');
                if (isPlaying) showMole();
            }, time);
        }

        // ดักจับการทุบโดนตัวตุ่น 🐹
        moles.forEach(mole => {
            mole.addEventListener('mousedown', (e) => {
                if (!mole.classList.contains('up') || !isPlaying) return;
                score++;
                scoreDisplay.textContent = score;
                playSound('hit'); // เล่นเสียงทุบโดน
                mole.classList.remove('up');
                e.stopPropagation();
            });
        });

        function startGame() {
            initAudio(); // ปลดล็อคระบบเสียง
            if (isPlaying) return;

            score = 0;
            timeLeft = 30;
            isPlaying = true;
            scoreDisplay.textContent = score;
            timeLeftDisplay.textContent = timeLeft;
            document.getElementById('startBtn').disabled = true;

            showMole();

            countdownTimer = setInterval(() => {
                timeLeft--;
                timeLeftDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            moles.forEach(mole => mole.classList.remove('up'));
            
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('mole_highScore', highScore);
                alert("🎉 สุดยอด! คุณทำลายสถิติสูงสุดใหม่: " + score + " คะแนน");
            } else {
                alert("🏁 จบเกม! คุณทุบตัวตุ่นได้: " + score + " คะแนน");
            }

            document.getElementById('startBtn').disabled = false;
        }
    </script>
</body>
</html>
